# Read by the SonarQube scan in .github/workflows/sonarqube.yml; the project
# key is passed there as an argument.

sonar.issue.ignore.multicriteria=ssrfBlocklist,devScriptPath

# The hardcoded IPv4 ranges are the SSRF blocklist of reserved and private
# networks; they are the point of the file, not configuration.
sonar.issue.ignore.multicriteria.ssrfBlocklist.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.ssrfBlocklist.resourceKey=server/safe-http.ts

# Local and CI check scripts start pnpm from the developer's or runner's PATH
# by design.
sonar.issue.ignore.multicriteria.devScriptPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.devScriptPath.resourceKey=scripts/**/*
