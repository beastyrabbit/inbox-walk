name: Quality and Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-inbox-walk
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version and dependency advisories
        run: |
          pnpm exec tsx scripts/check-release-version.ts
          pnpm exec tsx scripts/check-advisories.ts

      - name: Run static and unit checks
        run: pnpm check

      - name: Build production artifacts
        run: pnpm build

      - name: Install Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          pnpm exec tsx scripts/check-e2e-isolation.ts
          pnpm test:e2e

  container:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: arc-inbox-walk
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact

      - name: Set up remote BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build runtime candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: inbox-walk:ci-candidate

      - name: Boot non-root Node 24 runtime in demo mode
        run: bash scripts/smoke-container.sh inbox-walk:ci-candidate

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Runs only for version tags, after the image job succeeded. kub-homelab's deploy-release.yaml
  # then resolves the digest and updates the cluster pin; nobody edits kub-homelab by hand.
  notify-homelab:
    name: Hand off to homelab deployer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container]                 # every job that pushes an image for this repo
    runs-on: arc-inbox-walk            # in-cluster runner: LAN access to Infisical
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch deployer App credentials from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}   # identity github-actions-inbox-walk
          domain: "http://192.168.60.11:8080"
          project-slug: "kub-homelab"
          env-slug: "prod"
          secret-path: "/kubernetes/ci/homelab-deployer"                  # exports HOMELAB_DEPLOYER_APP_ID, HOMELAB_DEPLOYER_APP_PRIVATE_KEY

      - name: Mint a short-lived GitHub App installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.HOMELAB_DEPLOYER_APP_ID }}
          private-key: ${{ env.HOMELAB_DEPLOYER_APP_PRIVATE_KEY }}
          owner: beastyrabbit
          repositories: kub-homelab

      - name: Dispatch deploy-release in kub-homelab
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(printf '{"ref":"main","inputs":{"source_repository":"%s","version":"%s","source_sha":"%s","source_run_url":"%s"}}' \
                     "$GITHUB_REPOSITORY" "$version" "$GITHUB_SHA" "$run_url")"
          code="$(curl -sS -o "$RUNNER_TEMP/dispatch.out" -w '%{http_code}' -X POST \
                    -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    --data "$payload" \
                    "https://api.github.com/repos/beastyrabbit/kub-homelab/actions/workflows/deploy-release.yaml/dispatches")"
          [[ "$code" == "204" ]] || { echo "::error::dispatch failed with HTTP $code"; cat "$RUNNER_TEMP/dispatch.out"; exit 1; }
          echo "Dispatched deploy-release for $GITHUB_REPOSITORY v$version -> https://github.com/beastyrabbit/kub-homelab/actions/workflows/deploy-release.yaml" >> "$GITHUB_STEP_SUMMARY"
