name: Quality and Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel runs superseded by a newer push to the same PR; push, tag and manual runs keep separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: arc-inbox-walk
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version and dependency advisories
        run: |
          pnpm exec tsx scripts/check-release-version.ts
          pnpm exec tsx scripts/check-advisories.ts

      - name: Run static and unit checks
        run: pnpm check

      - name: Build production artifacts
        run: pnpm build

      - name: Install Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          pnpm exec tsx scripts/check-e2e-isolation.ts
          pnpm test:e2e

  main-ci:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: arc-inbox-walk
    timeout-minutes: 36
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check release version
        run: node scripts/check-release-version.ts

      - name: Require successful main CI for the peeled tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-main-ci.ts

  sourcemaps:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.main-ci.result == 'success' }}
    needs: main-ci
    runs-on: arc-inbox-walk
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up remote BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - name: Export injected source maps from the candidate build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: sourcemaps
          outputs: type=local,dest=./sourcemaps

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install source map uploader
        run: pnpm install --frozen-lockfile

      - name: Fetch GlitchTip release token through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          domain: "http://192.168.60.11:8080"
          project-slug: "kub-homelab"
          env-slug: "prod"
          secret-path: "/projects/inbox-walk/ci"

      - name: Upload source maps before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLITCHTIP_AUTH_TOKEN:-}"
          export SENTRY_AUTH_TOKEN="$GLITCHTIP_AUTH_TOKEN"
          release="inbox-walk@$(node -p 'JSON.parse(require("node:fs").readFileSync("sourcemaps/package.json", "utf8")).version')"
          pnpm exec sentry-cli --url http://192.168.60.68:8000 sourcemaps upload \
            --org beasty-rabbit --project inbox-walk --release "$release" \
            --strict sourcemaps/dist sourcemaps/dist-server

  container:
    if: >-
      ${{ !cancelled() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          ((startsWith(github.ref, 'refs/tags/v') && needs.quality.result == 'skipped' &&
            needs.main-ci.result == 'success' && needs.sourcemaps.result == 'success') ||
           (!startsWith(github.ref, 'refs/tags/v') && needs.quality.result == 'success' &&
            needs.main-ci.result == 'skipped' && needs.sourcemaps.result == 'skipped')) }}
    needs: [quality, main-ci, sourcemaps]
    runs-on: arc-inbox-walk
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates docker.io
          docker --version

      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact

      - name: Set up remote BuildKit
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_PUBLISH_TOKEN is a classic PAT with write:packages scope.
          # Fall back to the repository token for newly linked packages.
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build runtime candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: inbox-walk:ci-candidate

      - name: Boot non-root Node 24 runtime in demo mode
        run: bash scripts/smoke-container.sh inbox-walk:ci-candidate

      - name: Build and publish image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  post-deploy:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.container.result == 'success' }}
    needs: container
    runs-on: arc-inbox-walk
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for Flux rollout and smoke the deployed release
        run: node scripts/wait-deployment.ts
